name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run schema tests
        run: python -m pytest tests
      - name: Run PowerShell baseline check
        shell: pwsh
        run: |
          ./scripts/Test-EndpointBaseline.ps1 -BaselinePath ./baselines/windows-endpoint-baseline.json -ExportPath ./samples/device-configuration-export.json -OutputPath ./out/baseline-report.json
          ./scripts/New-ComplianceSummary.ps1 -CsvPath ./samples/compliance-export.csv -OutputPath ./out/compliance-summary.json
          Get-Content ./out/baseline-report.json
          Get-Content ./out/compliance-summary.json
